<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select Fund Amount</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0B7A2F,#2563EB);
    padding:10px;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 20px #0003;
}

.header{
    background:linear-gradient(135deg,#0B7A2F,#2563EB);
    color:#fff;
    text-align:center;
    padding:18px 10px;
}

.header h1{
    font-size:23px;
}

.content{
    padding:15px;
}

.message{
    background:#F0FDF4;
    border-left:4px solid #16A34A;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
}

.message h3{
    font-size:18px;
    margin-bottom:5px;
}

.message p{
    font-size:14px;
}

.option{
    display:flex;
    align-items:center;
    padding:12px 14px;
    margin-bottom:8px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:20px;
    font-weight:700;
    min-height:50px;
    cursor:pointer;
}

.option:hover{
    border-color:#16A34A;
    background:#F0FDF4;
}

.option input{
    margin-right:13px;
    transform:scale(1.4);
    accent-color:#16A34A;
}

.option:has(input:checked){
    border-color:#16A34A;
    background:#F0FDF4;
}

.summary{
    margin-top:15px;
    padding:18px;
    background:#F9FAFB;
    border-radius:10px;
    border:2px solid #e5e7eb;
}

.summary p{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    font-size:15px;
}

.summary p:last-child{
    margin-bottom:0;
}

.summary span{
    font-size:24px;
    font-weight:800;
    color:#0B7A2F;
    white-space:nowrap;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,#16A34A,#0B7A2F);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

button:active{
    transform:scale(.98);
}

.error{
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    background:#FEF2F2;
    color:#B91C1C;
    font-size:14px;
    text-align:center;
}

.footer{
    text-align:center;
    padding:12px;
    color:#666;
    font-size:12px;
}

@media(max-width:360px){

    .header h1{
        font-size:20px;
    }

    .content{
        padding:12px;
    }

    .option{
        font-size:18px;
        padding:10px;
    }

    .summary span{
        font-size:21px;
    }

    .summary p{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Select Fund Amount</h1>
    </div>

    <div class="content">

        <div class="message">
            <h3>Amount Selection</h3>
            <p>Please select the amount you wish to apply for.</p>
        </div>

        <label class="option">
            <input type="radio" name="amount"
                   value="22000" data-fee="1">
            KSh 22,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="30000" data-fee="450">
            KSh 30,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="40000" data-fee="550">
            KSh 40,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="50000" data-fee="650">
            KSh 50,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="65000" data-fee="800">
            KSh 65,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="75000" data-fee="900">
            KSh 75,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="85000" data-fee="1000">
            KSh 85,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="110000" data-fee="1200">
            KSh 110,000
        </label>

        <label class="option">
            <input type="radio" name="amount"
                   value="150000" data-fee="1500">
            KSh 150,000
        </label>

        <div class="summary">

            <p>
                <strong>Amount Selected:</strong>
                <span id="selected">KSh ---</span>
            </p>

            <p>
                <strong>Processing Fee:</strong>
                <span id="fee">KSh ---</span>
            </p>

        </div>

        <div class="error" id="error">
            Please select an amount first.
        </div>

        <button
            type="button"
            id="continueButton"
            disabled>
            Continue →
        </button>

    </div>

    <div class="footer">
        Application Portal
    </div>

</div>

<script>

const radios =
    document.querySelectorAll(
        'input[name="amount"]'
    );

const selected =
    document.getElementById("selected");

const fee =
    document.getElementById("fee");

const continueButton =
    document.getElementById("continueButton");

const error =
    document.getElementById("error");

let selectedAmount = null;
let selectedFee = null;


/*
|--------------------------------------------------------------------------
| Amount selection
|--------------------------------------------------------------------------
*/

radios.forEach((radio) => {

    radio.addEventListener("change", () => {

        selectedAmount =
            Number(radio.value);

        selectedFee =
            Number(radio.dataset.fee);

        selected.textContent =
            "KSh " +
            selectedAmount.toLocaleString("en-KE");

        fee.textContent =
            "KSh " +
            selectedFee.toLocaleString("en-KE");

        continueButton.disabled = false;

        error.style.display = "none";
    });

});


/*
|--------------------------------------------------------------------------
| Continue to payment
|--------------------------------------------------------------------------
*/

continueButton.addEventListener(
    "click",
    () => {

        if (
            !selectedAmount ||
            !selectedFee
        ) {

            error.style.display = "block";

            return;
        }


        /*
         * These values are used by the payment page
         * for display/navigation.
         *
         * The backend must independently validate
         * the amount and fee before charging.
         */

        localStorage.setItem(
            "loanAmount",
            String(selectedAmount)
        );

        localStorage.setItem(
            "processingFee",
            String(selectedFee)
        );


        window.location.href =
            "payment.html";
    }
);

</script>

</body>
</html>
