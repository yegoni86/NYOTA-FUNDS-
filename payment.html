<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYOTA FUNDS | Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0b7a2f, #2563eb);
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .header {
      padding: 35px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #0b7a2f, #2563eb);
    }

    .header h1 {
      font-size: 32px;
    }

    .header p {
      margin-top: 8px;
    }

    .content {
      padding: 25px;
    }

    .notice {
      padding: 15px;
      margin-bottom: 20px;
      background: #eff6ff;
      color: #1e3a8a;
      border-left: 4px solid #2563eb;
      border-radius: 10px;
    }

    .amount-card {
      padding: 20px;
      background: #f9fafb;
      border-radius: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: 600;
      color: #555;
    }

    .value {
      font-weight: bold;
      color: #16a34a;
      white-space: nowrap;
    }

    .payable {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      background: #ecfdf5;
      border-radius: 14px;
    }

    .payable span {
      display: block;
    }

    .payable .title {
      color: #166534;
      font-size: 16px;
    }

    .payable .amount {
      margin-top: 8px;
      color: #15803d;
      font-size: 32px;
      font-weight: bold;
    }

    .footer {
      padding: 18px;
      text-align: center;
      color: #666;
      border-top: 1px solid #eee;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .row {
        flex-direction: column;
      }

      .value {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>NYOTA FUNDS</h1>
      <p>Payment Information</p>
    </div>

    <div class="content">

      <div class="notice">
        Please review the amounts carefully before continuing.
      </div>

      <div class="amount-card">

        <div class="row">
          <span class="label">Selected Fund Amount</span>
          <span class="value" id="fundAmount">Ksh --</span>
        </div>

        <div class="row">
          <span class="label">Processing Fee</span>
          <span class="value" id="processingFee">Ksh --</span>
        </div>

      </div>

      <div class="payable">
        <span class="title">Amount Payable Now</span>
        <span class="amount" id="amountPayable">Ksh --</span>
      </div>

    </div>

    <div class="footer">
      Review all charges and terms before making any payment.
    </div>

  </div>

  <script>
    const fundAmount =
      Number(localStorage.getItem("loanAmount"));

    const processingFee =
      Number(localStorage.getItem("processingFee"));

    function formatKES(amount) {
      return "Ksh " +
        Number(amount).toLocaleString("en-KE");
    }

    document.getElementById("fundAmount").textContent =
      fundAmount > 0
        ? formatKES(fundAmount)
        : "Ksh --";

    document.getElementById("processingFee").textContent =
      processingFee >= 0
        ? formatKES(processingFee)
        : "Ksh --";

    document.getElementById("amountPayable").textContent =
      processingFee >= 0
        ? formatKES(processingFee)
        : "Ksh --";
  </script>

</body>
</html>
