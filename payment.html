<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYOTA FUNDS | Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0b7a2f, #2563eb);
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .header {
      padding: 35px 20px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #0b7a2f, #2563eb);
    }

    .header h1 {
      font-size: 32px;
    }

    .header p {
      margin-top: 8px;
      font-size: 17px;
    }

    .content {
      padding: 25px;
    }

    .notice {
      padding: 16px;
      margin-bottom: 20px;
      color: #1e3a8a;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      border-radius: 10px;
      line-height: 1.5;
    }

    .card {
      padding: 20px;
      background: #f9fafb;
      border-radius: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #555;
      font-weight: 600;
    }

    .value {
      color: #16a34a;
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
    }

    .payable {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      background: #ecfdf5;
      border-radius: 14px;
    }

    .payable-title {
      color: #166534;
      font-size: 16px;
    }

    .payable-amount {
      margin-top: 8px;
      color: #15803d;
      font-size: 32px;
      font-weight: bold;
    }

    .phone-section {
      margin-top: 20px;
    }

    .phone-section label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }

    .phone-input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
    }

    .phone-input:focus {
      border-color: #2563eb;
    }

    .test-button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-button:hover {
      background: #0b7a2f;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #166534;
      line-height: 1.5;
    }

    .footer {
      padding: 18px;
      text-align: center;
      color: #666;
      border-top: 1px solid #eee;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .row {
        align-items: flex-start;
        flex-direction: column;
      }

      .value {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>NYOTA FUNDS</h1>
      <p>Payment Information</p>
    </div>

    <div class="content">

      <div class="notice">
        Please review the amounts carefully before continuing.
        The requested fund amount and the amount payable now
        are separate amounts.
      </div>

      <div class="card">

        <div class="row">
          <span class="label">
            Selected Fund Amount
          </span>

          <span class="value" id="fundAmount">
            Ksh --
          </span>
        </div>

        <div class="row">
          <span class="label">
            Processing Fee
          </span>

          <span class="value" id="processingFee">
            Ksh --
          </span>
        </div>

      </div>

      <div class="payable">

        <div class="payable-title">
          Amount Payable Now
        </div>

        <div class="payable-amount" id="amountPayable">
          Ksh --
        </div>

      </div>

      <div class="phone-section">

        <label for="phone">
          M-Pesa Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          class="phone-input"
          placeholder="0712345678"
          maxlength="10"
          autocomplete="tel"
        >

      </div>

      <button
        type="button"
        class="test-button"
        id="testButton"
      >
        Test Payment Connection
      </button>

      <div
        class="result"
        id="result"
      ></div>

    </div>

    <div class="footer">
      Test environment — no payment is initiated.
    </div>

  </div>

  <script>

    const fundAmount =
      Number(localStorage.getItem("loanAmount"));

    const processingFee =
      Number(localStorage.getItem("processingFee"));

    const fundAmountElement =
      document.getElementById("fundAmount");

    const processingFeeElement =
      document.getElementById("processingFee");

    const amountPayableElement =
      document.getElementById("amountPayable");

    const phoneElement =
      document.getElementById("phone");

    const testButton =
      document.getElementById("testButton");

    const result =
      document.getElementById("result");


    function formatKES(amount) {

      return "Ksh " +
        Number(amount).toLocaleString("en-KE");

    }


    /*
     * Display the requested fund amount.
     */

    if (fundAmount > 0) {

      fundAmountElement.textContent =
        formatKES(fundAmount);

    }


    /*
     * Display the processing fee.
     */

    if (processingFee >= 0) {

      processingFeeElement.textContent =
        formatKES(processingFee);

      amountPayableElement.textContent =
        formatKES(processingFee);

    }


    /*
     * TEST ONLY
     *
     * This does not initiate an M-Pesa payment.
     */

    testButton.addEventListener(
      "click",
      async function () {

        result.style.display = "none";

        const phone =
          phoneElement.value.trim();

        if (!/^0[17][0-9]{8}$/.test(phone)) {

          result.textContent =
            "Please enter a valid Kenyan phone number.";

          result.style.display = "block";

          return;

        }

        if (
          !processingFee ||
          processingFee < 0
        ) {

          result.textContent =
            "The processing fee is not configured correctly.";

          result.style.display = "block";

          return;

        }

        testButton.disabled = true;

        testButton.textContent =
          "Testing connection...";

        try {

          const response =
            await fetch(
              "/api/payment",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Accept":
                    "application/json"
                },

                body:
                  JSON.stringify({

                    phone: phone,

                    /*
                     * IMPORTANT:
                     * The test sends the payable amount,
                     * NOT the selected fund amount.
                     */

                    amount: processingFee,

                    reference:
                      "TEST-" + Date.now(),

                    description:
                      "Payment connection test"
                  })
              }
            );

          const raw =
            await response.text();

          let data;

          try {

            data =
              JSON.parse(raw);

          } catch (error) {

            throw new Error(
              "Backend returned invalid JSON."
            );

          }

          if (!response.ok) {

            throw new Error(
              data.message ||
              data.error ||
              "Backend test failed."
            );

          }

          result.innerHTML =
            "<strong>Backend connection successful.</strong><br>" +
            "Requested fund amount: " +
            formatKES(fundAmount) +
            "<br>" +
            "Amount payable now: " +
            formatKES(processingFee) +
            "<br>" +
            "No payment was initiated.";

          result.style.display =
            "block";

        } catch (error) {

          result.textContent =
            error.message;

          result.style.display =
            "block";

        } finally {

          testButton.disabled =
            false;

          testButton.textContent =
            "Test Payment Connection";

        }

      }
    );

  </script>

</body>
</html>
