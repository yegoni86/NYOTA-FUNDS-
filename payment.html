<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Fee</title>
  <style>
    :root{
      --bg:#07596b;
      --bg2:#0b6475;
      --card:#ffffff;
      --text:#172033;
      --muted:#687486;
      --green:#14834a;
      --line:#e1e5e8;
      --button:#07596b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
    }
    .page{
      width:100%;
      max-width:620px;
      margin:auto;
      padding:30px 16px 60px;
    }
    .top{
      text-align:center;
      color:#fff;
      margin-bottom:26px;
    }
    .top h1{
      margin:0;
      font-size:34px;
      font-weight:800;
    }
    .top p{
      margin:10px 0 0;
      font-size:17px;
      opacity:.9;
    }
    .card{
      background:var(--card);
      border-radius:30px;
      padding:34px 28px 38px;
      box-shadow:0 18px 45px rgba(0,0,0,.22);
    }
    .title{
      text-align:center;
      font-size:30px;
      font-weight:800;
      margin:0 0 22px;
    }
    .welcome{
      text-align:center;
      font-size:19px;
      margin-bottom:25px;
    }
    .intro{
      text-align:center;
      color:var(--muted);
      line-height:1.55;
      font-size:17px;
      margin:0 auto 28px;
    }
    .fee{
      border:1px solid #b8ded0;
      background:#eef9f4;
      border-radius:20px;
      padding:22px 18px;
      text-align:center;
      margin-bottom:28px;
    }
    .fee-label{
      color:var(--muted);
      font-size:16px;
      margin-bottom:6px;
    }
    .fee-value{
      color:var(--green);
      font-size:35px;
      font-weight:800;
    }
    label{
      display:block;
      font-size:16px;
      font-weight:800;
      margin:0 0 9px;
    }
    input{
      width:100%;
      padding:16px 17px;
      border:2px solid var(--line);
      border-radius:15px;
      font-size:16px;
      outline:none;
      margin-bottom:21px;
    }
    input:focus{border-color:var(--bg)}
    button{
      width:100%;
      padding:17px;
      border:0;
      border-radius:15px;
      background:var(--button);
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    button:hover{background:var(--bg2)}
    .status{
      display:none;
      margin-top:16px;
      padding:13px;
      border-radius:12px;
      background:#eef9f4;
      color:var(--green);
      text-align:center;
      font-weight:700;
    }
    @media(max-width:480px){
      .page{padding:24px 12px 45px}
      .card{padding:30px 21px 34px}
      .top h1{font-size:30px}
      .title{font-size:28px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Payment</h1>
      <p>Secure checkout</p>
    </header>

    <section class="card">
      <h2 class="title">Processing Fee</h2>

      <div class="welcome">
        Welcome, <strong id="displayName">Customer</strong>
      </div>

      <p class="intro">
        Please review the payment details below and enter your information to continue.
      </p>

      <div class="fee">
        <div class="fee-label">Processing Fee</div>
        <div class="fee-value">KSh 350</div>
      </div>

      <form id="paymentForm">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your full name" required>

        <label for="phone">M-PESA Phone Number</label>
        <input id="phone" type="tel" inputmode="numeric"
               placeholder="2547XXXXXXXX" required>

        <button type="submit">Pay Processing Fee</button>
        <div class="status" id="status"></div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("paymentForm");
    const nameInput = document.getElementById("name");
    const displayName = document.getElementById("displayName");
    const status = document.getElementById("status");

    nameInput.addEventListener("input", () => {
      displayName.textContent = nameInput.value.trim() || "Customer";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      status.style.display = "block";
      status.textContent = "Starting secure payment...";

      try {
        const response = await fetch("/api/mpesa/stkpush", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            phone: document.getElementById("phone").value.trim(),
            amount: 350
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to start payment.");
        }

        status.textContent =
          data.message || "Check your phone and complete the M-PESA prompt.";
      } catch (error) {
        status.textContent =
          "Payment service is not connected yet. Configure the server-side M-PESA credentials first.";
      }
    });
  </script>
</body>
</html>
